# THROWAWAY PROTOTYPE - not a workspace member. See src/main.rs.
[package]
name = "mermaid-render-proto"
version = "0.0.0"
edition = "2024"
publish = false

# Own workspace root so no parent workspace ever adopts this crate.
[workspace]

[dependencies]
mermaid-text = "=0.57.0"
mmdflux = { version = "=2.6.1", default-features = false }
merman = { version = "=0.9.0", default-features = false, features = ["ascii", "diagram-flowchart", "diagram-sequence"] }
